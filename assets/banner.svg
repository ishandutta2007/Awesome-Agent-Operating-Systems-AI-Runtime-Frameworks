<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="textGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="40%" stop-color="#e0f2fe"/><stop offset="80%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/></linearGradient><linearGradient id="glowGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></linearGradient><filter id="bloom" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes floatOrb1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-25px) scale(1.15)}}@keyframes floatOrb2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-45px,35px) scale(.9)}}@keyframes pulseRing{0%{r:16;opacity:.8}50%{r:28;opacity:.15}}@keyframes badgeGlow{0%{opacity:.85;filter:drop-shadow(0 0 8px rgba(56,189,248,.4))}50%{opacity:1;filter:drop-shadow(0 0 16px rgba(129,140,248,.7))}}.font-sub,.font-title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.font-title{font-weight:800}.font-sub{font-weight:400}.font-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-weight:600}.orb-1{animation:floatOrb1 12s ease-in-out infinite}.orb-2{animation:floatOrb2 15s ease-in-out infinite}.ring-pulse{animation:pulseRing 3.5s ease-in-out infinite}.data-flow{stroke-dasharray:8 12;animation:dashCycle 4s linear infinite}</style><rect width="1200" height="420" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2" rx="20"/><g opacity=".6"><circle cx="220" cy="110" r="140" fill="url(#glowGlow)" class="orb-1" filter="url(#bloom)"/><circle cx="980" cy="300" r="160" fill="url(#glowGlow)" class="orb-2" filter="url(#bloom)"/><circle cx="850" cy="90" r="100" fill="#6366f1" class="orb-1" filter="url(#bloom)" opacity=".12"/></g><g stroke="#38bdf8" stroke-width="1" opacity=".12"><line x1="100" x2="100" y1="0" y2="420"/><line x1="250" x2="250" y1="0" y2="420"/><line x1="400" x2="400" y1="0" y2="420"/><line x1="550" x2="550" y1="0" y2="420"/><line x1="700" x2="700" y1="0" y2="420"/><line x1="850" x2="850" y1="0" y2="420"/><line x1="1000" x2="1000" y1="0" y2="420"/><line x1="1150" x2="1150" y1="0" y2="420"/><line x1="0" x2="1200" y1="70" y2="70"/><line x1="0" x2="1200" y1="140" y2="140"/><line x1="0" x2="1200" y1="210" y2="210"/><line x1="0" x2="1200" y1="280" y2="280"/><line x1="0" x2="1200" y1="350" y2="350"/></g><g fill="none" opacity=".45"><path stroke="#38bdf8" stroke-width="1.8" d="M 80,360 L 260,360 L 320,385 L 880,385 L 940,360 L 1120,360" class="data-flow"/><path stroke="#818cf8" stroke-width="1.8" d="M 120,50 L 300,50 L 360,25 L 840,25 L 900,50 L 1080,50" class="data-flow"/></g><g id="foreground-content"><g transform="translate(600, 72)"><rect width="390" height="36" x="-195" y="-18" fill="#0f172a" stroke="url(#accentCyan)" stroke-width="1.5" rx="18"/><circle cx="-165" cy="0" r="6" fill="#38bdf8"/><circle cx="-165" cy="0" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" class="ring-pulse"/><text x="-145" y="5" fill="#94a3b8" class="font-mono" font-size="12" letter-spacing="1.5">RUNTIME LAYER &amp; AGENT OS ECOSYSTEM</text></g><g><text fill="url(#textGradient)" class="font-title" filter="url(#subtleGlow)" font-size="44" letter-spacing="-.5" text-anchor="middle" transform="translate(600, 160)">Autonomous Agent Operating Systems</text><text y="44" fill="#e2e8f0" class="font-title" font-size="28" letter-spacing="0" text-anchor="middle" transform="translate(600, 160)">&amp; AI Runtime Frameworks</text></g><g><text fill="#94a3b8" class="font-sub" font-size="16" letter-spacing=".2" text-anchor="middle" transform="translate(600, 248)">Curated architecture landscape of stateful execution loops, persistent memory kernels,</text><text y="24" fill="#94a3b8" class="font-sub" font-size="16" letter-spacing=".2" text-anchor="middle" transform="translate(600, 248)">multi-agent orchestration graphs, secure sandboxes, and MCP tool protocols.</text></g><g><g transform="translate(600, 328) translate(-410, 0)"><rect width="185" height="38" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="19"/><circle cx="20" cy="19" r="5" fill="#38bdf8"/><text x="34" y="24" fill="#e2e8f0" class="font-mono" font-size="12">OS Kernels &amp; Sched</text></g><g transform="translate(600, 328) translate(-205, 0)"><rect width="195" height="38" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="19"/><circle cx="20" cy="19" r="5" fill="#818cf8"/><text x="34" y="24" fill="#e2e8f0" class="font-mono" font-size="12">Multi-Agent Graphs</text></g><g transform="translate(600, 328) translate(10, 0)"><rect width="185" height="38" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="19"/><circle cx="20" cy="19" r="5" fill="#c084fc"/><text x="34" y="24" fill="#e2e8f0" class="font-mono" font-size="12">Long-Term Memory</text></g><g transform="translate(600, 328) translate(215, 0)"><rect width="195" height="38" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="19"/><circle cx="20" cy="19" r="5" fill="#34d399"/><text x="34" y="24" fill="#e2e8f0" class="font-mono" font-size="12">MCP &amp; MicroVM Sandboxes</text></g></g></g></svg>