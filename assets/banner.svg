<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="glowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>

    <!-- Filter for soft neon bloom -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }

    /* Animated floating background orbs */
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(50px, -25px) scale(1.15); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-45px, 35px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes pulseRing {
      0% { r: 16; opacity: 0.8; }
      50% { r: 28; opacity: 0.15; }
      100% { r: 16; opacity: 0.8; }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -80; }
    }
    @keyframes badgeGlow {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 8px rgba(56,189,248,0.4)); }
      50% { opacity: 1; filter: drop-shadow(0 0 16px rgba(129,140,248,0.7)); }
    }

    .orb-1 { animation: floatOrb1 12s ease-in-out infinite; }
    .orb-2 { animation: floatOrb2 15s ease-in-out infinite; }
    .ring-pulse { animation: pulseRing 3.5s ease-in-out infinite; }
    .data-flow { stroke-dasharray: 8 12; animation: dashCycle 4s linear infinite; }
    .badge-card { animation: badgeGlow 4s ease-in-out infinite; }
  </style>

  <!-- Deep Slate Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g opacity="0.6">
    <circle class="orb-1" cx="220" cy="110" r="140" fill="url(#glowGlow)" filter="url(#bloom)" />
    <circle class="orb-2" cx="980" cy="300" r="160" fill="url(#glowGlow)" filter="url(#bloom)" />
    <circle class="orb-1" cx="850" cy="90" r="100" fill="#6366f1" opacity="0.12" filter="url(#bloom)" />
  </g>

  <!-- Grid Pattern Overlay for Futuristic OS feel -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1150" y1="0" x2="1150" y2="420" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Background Dynamic Circuit / Network Connectors -->
  <g fill="none" opacity="0.45">
    <path class="data-flow" d="M 80,360 L 260,360 L 320,385 L 880,385 L 940,360 L 1120,360" stroke="#38bdf8" stroke-width="1.8" />
    <path class="data-flow" d="M 120,50 L 300,50 L 360,25 L 840,25 L 900,50 L 1080,50" stroke="#818cf8" stroke-width="1.8" />
  </g>

  <!-- Main Content in Foreground (guaranteed crisp readability) -->
  <g id="foreground-content">
    <!-- Top System Architecture Badge -->
    <g transform="translate(600, 72)">
      <rect x="-195" y="-18" width="390" height="36" rx="18" fill="#0f172a" stroke="url(#accentCyan)" stroke-width="1.5" />
      <circle cx="-165" cy="0" r="6" fill="#38bdf8" />
      <circle class="ring-pulse" cx="-165" cy="0" r="12" stroke="#38bdf8" stroke-width="1.5" fill="none" />
      <text class="font-mono" x="-145" y="5" font-size="12" fill="#94a3b8" letter-spacing="1.5">RUNTIME LAYER &amp; AGENT OS ECOSYSTEM</text>
    </g>

    <!-- Main Title (Gradient Fill + Subtle Drop Shadow) -->
    <g transform="translate(600, 160)">
      <text class="font-title" text-anchor="middle" font-size="44" fill="url(#textGradient)" letter-spacing="-0.5" filter="url(#subtleGlow)">
        Autonomous Agent Operating Systems
      </text>
      <text class="font-title" text-anchor="middle" font-size="28" fill="#e2e8f0" y="44" letter-spacing="0">
        &amp; AI Runtime Frameworks
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <g transform="translate(600, 248)">
      <text class="font-sub" text-anchor="middle" font-size="16" fill="#94a3b8" letter-spacing="0.2">
        Curated architecture landscape of stateful execution loops, persistent memory kernels,
      </text>
      <text class="font-sub" text-anchor="middle" font-size="16" fill="#94a3b8" y="24" letter-spacing="0.2">
        multi-agent orchestration graphs, secure sandboxes, and MCP tool protocols.
      </text>
    </g>

    <!-- Foreground Feature Pills -->
    <g transform="translate(600, 328)">
      <!-- Pill 1: Kernel & Scheduling -->
      <g transform="translate(-410, 0)">
        <rect x="0" y="0" width="185" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="19" r="5" fill="#38bdf8" />
        <text class="font-mono" x="34" y="24" font-size="12" fill="#e2e8f0">OS Kernels &amp; Sched</text>
      </g>

      <!-- Pill 2: Multi-Agent Orchestration -->
      <g transform="translate(-205, 0)">
        <rect x="0" y="0" width="195" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="19" r="5" fill="#818cf8" />
        <text class="font-mono" x="34" y="24" font-size="12" fill="#e2e8f0">Multi-Agent Graphs</text>
      </g>

      <!-- Pill 3: Stateful Memory -->
      <g transform="translate(10, 0)">
        <rect x="0" y="0" width="185" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="19" r="5" fill="#c084fc" />
        <text class="font-mono" x="34" y="24" font-size="12" fill="#e2e8f0">Long-Term Memory</text>
      </g>

      <!-- Pill 4: MCP & Sandboxes -->
      <g transform="translate(215, 0)">
        <rect x="0" y="0" width="195" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="20" cy="19" r="5" fill="#34d399" />
        <text class="font-mono" x="34" y="24" font-size="12" fill="#e2e8f0">MCP &amp; MicroVM Sandboxes</text>
      </g>
    </g>
  </g>
</svg>